services:
  postgre:
    image: postgres:12.17
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: Pg123
      POSTGRES_USER: kubedevnews
      POSTGRES_DB: kubedevnews
    volumes:
      - postgres_docker_vol:/var/lib/postgresql/data
    networks:
      - kube_news_net
  kube_news:
    image: diogobu/kube-news:v3
    build:
      context: ./src
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    networks:
      - kube_news_net
    depends_on:
      - postgre
    environment:
      DB_PASSWORD: Pg123
      DB_USER: kubedevnews
      DB_DATABASE: kubedevnews
      DB_HOST: postgre

volumes:
  postgres_docker_vol:
    name: postgre_exemplo_vol

networks:
  kube_news_net: #nome
    driver: bridge #tipo de rede
