services:
  postgre:
    image: postgres:${POSTGRES_TAG}
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_docker_vol:/var/lib/postgresql/data
    networks:
      - kube_news_net

  web:
    extends:
      service: kube_news
      file: ./kubenews.compose.yaml

volumes:
  postgres_docker_vol:
    name: postgre_exemplo_vol

networks:
  kube_news_net: #nome
    driver: bridge #tipo de rede
